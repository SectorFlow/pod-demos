<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Voice Concierge Pod Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --sf-primary: #1A6FC4;
    --sf-light: #2EA0E0;
    --sf-bright: #35B8F0;
    --sf-navy: #0B1628;
    --sf-charcoal: #1E2A3A;
    --sf-slate: #3A4A5C;
    --sf-mid: #6B7B8D;
    --sf-bg-alt: #F2F4F7;
    --sf-off: #FAFBFC;
    --ok: #16A34A;
    --ok-soft: #DCFCE7;
    --warn: #B45309;
    --warn-soft: #FEF3C7;
    --err: #DC2626;
    --err-soft: #FEE2E2;
    --line: #DCE2EA;
    /* tenant-facing brand, swapped by the white-label beat */
    --b-primary: #1A6FC4;
    --b-accent: #2EA0E0;
    --b-soft: #E8F1FB;
    --b-nav: #0B1628;
    --sans: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  body.brand-northstar {
    --b-primary: #1F4E79;
    --b-accent: #F2A900;
    --b-soft: #FDF4DC;
    --b-nav: #10263D;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--sf-off); color: var(--sf-slate); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--sf-light); outline-offset: 2px; }

  /* Presenter bar */
  .topbar { display: flex; align-items: center; gap: 16px; padding-inline: 20px; padding-block: 10px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .topbar img { height: 30px; width: auto; display: block; }
  .topbar .home-link { display: block; line-height: 0; border-radius: 4px; }
  .topbar .home-link:focus-visible { outline: 2px solid var(--sf-primary); outline-offset: 3px; }
  .topbar .ttl { font-weight: 600; color: var(--sf-navy); font-size: 14px; }
  .topbar .sub { color: var(--sf-mid); font-size: 12.5px; }
  .topbar .grow { flex: 1; }
  .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--sf-navy); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn:hover { border-color: var(--sf-light); }
  .btn.primary { background: var(--sf-primary); color: #fff; border-color: var(--sf-primary); }
  .btn.primary:hover { background: #155CA3; }
  .btn[aria-pressed="true"] { background: var(--sf-navy); color: #fff; border-color: var(--sf-navy); }
  .counter { font-family: var(--mono); font-size: 12px; color: var(--sf-mid); min-width: 52px; text-align: center; }

  .stage { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; padding-inline: 20px; padding-block: 20px 32px; max-width: 1480px; margin: 0 auto; }
  @media (max-width: 980px) { .stage { grid-template-columns: 1fr; } }

  /* Narration */
  .narr { display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .beat-no { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--sf-primary); margin-bottom: 4px; }
  .beat-title { font-size: 18px; font-weight: 600; color: var(--sf-navy); line-height: 1.3; margin: 0 0 8px; text-wrap: balance; }
  .vo { font-size: 14.5px; color: var(--sf-slate); margin: 0 0 10px; }
  .proves { font-size: 12.5px; color: var(--sf-mid); border-top: 1px solid var(--line); padding-top: 8px; }
  .proves b { color: var(--sf-navy); font-weight: 600; }
  .who { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; background: var(--sf-bg-alt); border-radius: 999px; padding: 2px 10px; color: var(--sf-slate); margin-bottom: 10px; }
  .beats { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; }
  .beats li button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 5px; display: grid; grid-template-columns: 24px 1fr; gap: 6px; font-size: 13px; color: var(--sf-slate); cursor: pointer; }
  .beats li button:hover { background: var(--sf-bg-alt); }
  .beats li button.on { background: #E8F1FB; color: var(--sf-navy); font-weight: 600; }
  .beats .n { font-family: var(--mono); font-size: 11.5px; color: var(--sf-mid); padding-top: 1px; }
  .beats .sect { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--sf-mid); padding: 10px 8px 2px; }
  .hint { font-size: 12px; color: var(--sf-mid); }
  .hint kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: #fff; }

  /* Browser frame */
  .frame { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(11,22,40,.08); display: flex; flex-direction: column; min-height: 640px; }
  .chrome { display: flex; align-items: center; gap: 10px; background: #EEF1F5; border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #CBD3DC; display: block; }
  .url { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-family: var(--mono); font-size: 12px; color: var(--sf-slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url .lock { color: var(--ok); margin-right: 6px; }
  .tag-surface { font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .tag-surface.portal { background: var(--b-soft); color: var(--b-primary); }
  .tag-surface.console { background: #EEF0F2; color: #4B5563; }
  .tag-surface.one { background: #EEF0F2; color: #4B5563; }
  .screen { flex: 1; display: flex; min-height: 0; }

  /* Portal (tenant-facing, branded) */
  .p-nav { width: 210px; background: var(--b-nav); color: #D7E1EC; display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; flex-shrink: 0; }
  .p-brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; }
  .p-brand .logo-chip { background: #fff; border-radius: 6px; padding: 4px 6px; display: flex; align-items: center; }
  .p-brand .logo-chip img { height: 22px; width: auto; display: block; }
  .p-brand .ns { display: none; align-items: center; gap: 8px; color: #fff; font-weight: 600; font-size: 15px; }
  body.brand-northstar .p-brand .sf { display: none; }
  body.brand-northstar .p-brand .ns { display: flex; }
  .p-nav a { display: flex; align-items: center; gap: 10px; color: #C9D4E0; text-decoration: none; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; }
  .p-nav a.on { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 3px 0 0 var(--b-accent); }
  .p-sect { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #8FA2B6; padding: 12px 10px 4px; }
  .pods { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .pod { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .pod.live { border-color: var(--b-primary); box-shadow: 0 0 0 1px var(--b-primary) inset; }
  .pod .ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pod .pn { font-weight: 600; color: var(--sf-navy); font-size: 15px; }
  .pod .pd { font-size: 12.5px; color: var(--sf-mid); min-height: 36px; }
  .pod dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
  .pod dt { color: var(--sf-mid); }
  .pod dd { margin: 0; color: var(--sf-navy); font-variant-numeric: tabular-nums; }
  .pod .pstage { display: flex; gap: 4px; }
  .pod .pstage i { flex: 1; height: 4px; border-radius: 2px; background: var(--sf-bg-alt); }
  .pod .pstage i.on { background: var(--b-primary); }
  .pod .open { margin-top: auto; font-size: 12.5px; font-weight: 600; color: var(--b-primary); }
  .shared { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .shared .tile b { color: var(--sf-navy); font-size: 13px; }
  .shared .uses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .p-nav .tenant { margin-top: auto; font-size: 12px; color: #9FB0C3; padding: 8px 10px; border-top: 1px solid rgba(255,255,255,.1); }
  .p-nav .tenant b { color: #fff; font-weight: 600; display: block; }
  .p-main { flex: 1; min-width: 0; padding: 22px 26px; background: #fff; overflow: auto; }
  .p-h { font-size: 20px; font-weight: 600; color: var(--sf-navy); margin: 0 0 4px; }
  .p-sub { color: var(--sf-mid); margin: 0 0 18px; font-size: 13px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .tile { flex: 1 1 160px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--sf-mid); }
  .tile .v { font-size: 22px; font-weight: 600; color: var(--sf-navy); font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12px; color: var(--sf-mid); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.err { background: var(--err-soft); color: var(--err); }
  .pill.b { background: var(--b-soft); color: var(--b-primary); }
  .pill.n { background: var(--sf-bg-alt); color: var(--sf-slate); }
  .pbtn { background: var(--b-primary); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .pbtn.ghost { background: #fff; color: var(--b-primary); border: 1px solid var(--b-primary); }
  .pbtn:disabled { background: #C9D1DA; color: #fff; cursor: not-allowed; border-color: #C9D1DA; }

  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--sf-mid); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--sf-bg-alt); }
  table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }

  .search { display: flex; gap: 8px; margin-bottom: 14px; }
  .search .in { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; font-size: 14px; color: var(--sf-navy); background: #fff; }
  .res { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .res.top { border-color: var(--b-primary); box-shadow: 0 0 0 1px var(--b-primary) inset; }
  .res .sku { font-family: var(--mono); font-size: 12.5px; color: var(--b-primary); font-weight: 500; }
  .res .desc { color: var(--sf-navy); font-weight: 500; }
  .res .meta { font-size: 12px; color: var(--sf-mid); grid-column: 1 / -1; }
  .res .score { font-family: var(--mono); font-size: 12px; color: var(--sf-mid); text-align: right; }
  .cite { font-family: var(--mono); font-size: 11px; color: var(--sf-mid); background: var(--sf-bg-alt); border-radius: 4px; padding: 1px 6px; }

  .mail { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .mail .hd { background: var(--sf-bg-alt); padding: 10px 14px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .mail .hd b { color: var(--sf-navy); }
  .mail pre { margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--sf-navy); line-height: 1.55; }
  .inbox { width: 250px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .inbox div { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .inbox div:last-child { border-bottom: 0; }
  .inbox div.on { background: var(--b-soft); box-shadow: inset 3px 0 0 var(--b-primary); }
  .inbox b { display: block; color: var(--sf-navy); font-weight: 600; font-size: 12.5px; }
  .inbox span { color: var(--sf-mid); }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; transition: opacity .3s; }
  .steps li.pending { opacity: .35; }
  .steps .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--sf-mid); }
  .steps li.done .ic { background: var(--ok); }
  .steps li.flag .ic { background: #D97706; }
  .steps .st { font-weight: 600; color: var(--sf-navy); font-size: 13px; }
  .steps .sd { font-size: 12.5px; color: var(--sf-slate); }
  .steps .svc { font-family: var(--mono); font-size: 11px; color: var(--sf-mid); white-space: nowrap; }
  .flagbox { border: 1px solid #F5C77E; background: #FFFBEB; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #7C4A03; margin-block: 12px; }

  /* Console (unbranded) */
  .c-wrap { flex: 1; display: flex; flex-direction: column; background: #F7F8FA; min-width: 0; }
  .c-top { background: #fff; border-bottom: 1px solid #E3E6EA; padding: 10px 18px; display: flex; align-items: center; gap: 12px; font-size: 13px; flex-wrap: wrap; }
  .c-top b { color: #111827; }
  .c-top .muted { color: #6B7280; }
  .c-body { padding: 18px; overflow: auto; }
  .c-h { font-size: 16px; font-weight: 600; color: #111827; margin: 0 0 12px; }
  .c-card { background: #fff; border: 1px solid #E3E6EA; border-radius: 6px; padding: 14px; margin-bottom: 14px; }
  .code { font-family: var(--mono); font-size: 12px; background: #0F172A; color: #E2E8F0; border-radius: 6px; padding: 10px 12px; white-space: pre; overflow-x: auto; }

  /* One studio */
  .one-wrap { flex: 1; display: flex; flex-direction: column; background: #F5F7FA; min-width: 0; }
  .flow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-block: 8px 16px; }
  .node { background: #fff; border: 1px solid #D5DBE3; border-radius: 6px; padding: 8px 10px; font-size: 12.5px; color: #1F2937; }
  .node small { display: block; color: #6B7280; font-size: 11px; font-family: var(--mono); }
  .arrow { color: #9CA3AF; }
  .gate { border-radius: 8px; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .gate.blocked { background: var(--err-soft); border: 1px solid #FCA5A5; }
  .gate.passed { background: var(--ok-soft); border: 1px solid #86EFAC; }
  .gate .big { font-size: 22px; font-weight: 700; }
  .gate.blocked .big { color: var(--err); }
  .gate.passed .big { color: var(--ok); }

  /* Sign-in */
  .signin { flex: 1; display: grid; place-items: center; background: linear-gradient(135deg, var(--b-nav) 0%, var(--b-primary) 100%); padding: 30px 16px; }
  .signin .box { background: #fff; border-radius: 10px; padding: 28px; width: min(360px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .signin img { height: 34px; width: auto; }
  .signin .ns-logo { display: none; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--b-nav); }
  body.brand-northstar .signin img { display: none; }
  body.brand-northstar .signin .ns-logo { display: flex; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font-size: 12.5px; color: var(--sf-mid); }
  .field span.v { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--sf-navy); font-size: 14px; }

  .bar { height: 8px; background: var(--sf-bg-alt); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--b-primary); border-radius: 4px; transition: width .6s ease; }
  .cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .spot { animation: spot 1.6s ease-in-out 2; }
  @keyframes spot { 0%,100% { box-shadow: 0 0 0 0 rgba(46,160,224,0); } 50% { box-shadow: 0 0 0 5px rgba(46,160,224,.35); } }
  @media (prefers-reduced-motion: reduce) { .spot { animation: none; } .bar i, .steps li { transition: none; } }
  @media (max-width: 720px) {
    .p-nav { width: 64px; }
    .p-nav a span.lbl, .p-nav .tenant, .p-sect, .p-brand .ns span { display: none; }
    .p-brand .logo-chip img { height: 16px; }
    .inbox { width: 100%; }
    .p-main { padding: 16px; }
  }
  .tag-surface.eng { background: #1F2937; color: #E5E7EB; }
  .eng-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0D1117; color: #E6EDF3; }
  .eng-top { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid #243041; font-size: 12.5px; color: #9FB1C4; flex-wrap: wrap; }
  .eng-top b { color: #E6EDF3; }
  .eng-body { padding: 16px 18px; overflow: auto; flex: 1; }
  .term { font-family: var(--mono); font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; color: #D6DEE8; }
  .term .p { color: #7EE787; }
  .term .c { color: #79C0FF; }
  .term .d { color: #8B98A8; }
  .term .ok { color: #7EE787; }
  .term .w { color: #F2CC60; }
  .term .e { color: #FF7B72; }
  .codev { font-family: var(--mono); font-size: 12.3px; line-height: 1.6; white-space: pre; overflow-x: auto; color: #D6DEE8; background: #0D1117; }
  .codev .k { color: #79C0FF; }
  .codev .s { color: #A5D6FF; }
  .codev .cm { color: #8B98A8; }
  .codev .hl { background: rgba(242, 204, 96, .14); display: inline-block; width: 100%; }
  .lf-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 90px 80px; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #1E2733; font-size: 12.3px; align-items: center; }
  .lf-row.hd { color: #8B98A8; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .lf-row .nm { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lf-row .num { text-align: right; font-variant-numeric: tabular-nums; color: #C9D4E0; }
  .lf-bar { height: 6px; background: #2F81F7; border-radius: 3px; }
  .lf-kind { font-size: 10.5px; font-family: var(--mono); padding: 1px 6px; border-radius: 4px; background: #1F2A37; color: #9FB1C4; margin-right: 6px; }
  .lf-kind.gen { background: #1B2F4F; color: #79C0FF; }
  .lf-kind.tool { background: #2A2440; color: #D2A8FF; }
  .lf-kind.guard { background: #16321F; color: #7EE787; }
  .lf-kind.wait { background: #3B2E10; color: #F2CC60; }
  .gh-check { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #1E2733; align-items: start; font-size: 13px; }
  .gh-check .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #0D1117; }
  .gh-check .ic.ok { background: #3FB950; }
  .gh-check .ic.bad { background: #F85149; }
  .gh-check small { display: block; color: #8B98A8; font-size: 12px; }
  .gh-box { border: 1px solid #243041; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
  .gh-merge { padding: 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .gh-btn { border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 600; font-size: 12.5px; }
  .gh-btn.dis { background: #21262D; color: #6E7681; }
  .gh-btn.go { background: #238636; color: #fff; }
  .sec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
  /* Voice pod additions */
  .tx { display: flex; flex-direction: column; gap: 6px; }
  .tx .ln { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 10px; border-radius: 6px; transition: opacity .3s; font-size: 13.3px; }
  .tx .ln.pending { opacity: 0; }
  .tx .ln .sp { font-size: 11.5px; font-weight: 600; color: var(--sf-mid); padding-top: 1px; }
  .tx .ln.agent { background: var(--b-soft); }
  .tx .ln.agent .sp { color: var(--b-primary); }
  .tx .ln.caller .sp { color: var(--sf-navy); }
  .tx .ln.tool { background: #F5F0FF; font-family: var(--mono); font-size: 12px; color: #4C2A85; }
  .tx .ln.tool .sp { color: #7C3AED; font-family: var(--sans); }
  .tx .ln.sys { background: var(--sf-bg-alt); font-size: 12.5px; color: var(--sf-slate); }
  .tx .ln.sys .sp { color: var(--sf-mid); }
  .tx .ln.xfer { background: var(--warn-soft); color: #7C4A03; font-size: 12.5px; }
  .tx .ln.xfer .sp { color: var(--warn); }
  .tx .ms { font-family: var(--mono); font-size: 11px; color: var(--sf-mid); white-space: nowrap; }
  .twocol { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .twocol { grid-template-columns: 1fr; } }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .side .tile { flex: none; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.8px; margin: 0; }
  .kv dt { color: var(--sf-mid); }
  .kv dd { margin: 0; color: var(--sf-navy); font-variant-numeric: tabular-nums; }
  .h3 { font-size: 14px; color: var(--sf-navy); margin: 0 0 8px; font-weight: 600; }
  .note { font-size: 12px; color: var(--sf-mid); margin-top: 10px; }
  .hb { display: flex; flex-direction: column; gap: 5px; }
  .hb-row { display: grid; grid-template-columns: 230px minmax(0, 1fr) 64px 56px; gap: 10px; align-items: center; font-size: 12.8px; }
  .hb-row .lbl { color: var(--sf-navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hb-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--sf-slate); }
  .hb-row .track { height: 12px; background: var(--sf-bg-alt); border-radius: 3px; overflow: hidden; }
  .hb-row .track i { display: block; height: 100%; background: var(--b-primary); border-radius: 3px; width: 0; transition: width .7s ease; }
  .hb-row .track i.alt { background: #F59E0B; }
  .fam { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .fam div { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; background: #fff; }
  .fam div b { display: block; color: var(--sf-navy); font-size: 13px; }
  .fam div.sel { box-shadow: 0 0 0 2px var(--b-primary) inset; }
  .player { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .player .play { width: 30px; height: 30px; border-radius: 50%; background: var(--b-primary); color: #fff; display: grid; place-items: center; font-size: 12px; flex-shrink: 0; }
  .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 30px; min-width: 0; overflow: hidden; }
  .wave i { flex: 1; min-width: 2px; background: #B9CCE3; border-radius: 1px; }
  .wave i.pl { background: var(--b-primary); }
  .tr { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tr-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 76px; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; align-items: center; }
  .tr-row:last-child { border-bottom: 0; }
  .tr-row.hd { background: var(--sf-bg-alt); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--sf-mid); font-weight: 600; }
  .tr-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sf-navy); }
  .tr-row .num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
  .tr-row .bar2 { position: relative; height: 10px; }
  .tr-row .bar2 i { position: absolute; top: 0; height: 10px; border-radius: 3px; background: var(--b-primary); }
  .tr-row .bar2 i.k-stt { background: #0EA5E9; }
  .tr-row .bar2 i.k-llm { background: #1A6FC4; }
  .tr-row .bar2 i.k-tts { background: #16A34A; }
  .tr-row .bar2 i.k-tool { background: #7C3AED; }
  .tr-row .bar2 i.k-kb { background: #F59E0B; }
  .tr-row.hl { background: #F5FAFF; }
  .kind { font-size: 10.5px; font-family: var(--mono); padding: 1px 6px; border-radius: 4px; margin-right: 6px; color: #fff; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--sf-mid); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
  .form { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; align-items: center; }
  .form .l { color: var(--sf-mid); font-size: 12.5px; }
  .form .v { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--sf-navy); background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs span { padding: 7px 12px; font-size: 13px; color: var(--sf-mid); border-bottom: 2px solid transparent; }
  .tabs span.on { color: var(--b-primary); border-color: var(--b-primary); font-weight: 600; }
  .toast { display: flex; gap: 10px; align-items: center; background: var(--ok-soft); border: 1px solid #86EFAC; color: #14532D; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-block: 12px; }
  .say { border-left: 3px solid var(--b-primary); background: var(--b-soft); padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: 13.5px; color: var(--sf-navy); }
  .funnel { display: flex; flex-direction: column; gap: 6px; }
  .funnel .fr { display: grid; grid-template-columns: 200px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 12.8px; }
  .funnel .fr .track { height: 20px; background: var(--sf-bg-alt); border-radius: 4px; overflow: hidden; }
  .funnel .fr .track i { display: block; height: 100%; background: var(--b-primary); width: 0; transition: width .7s ease; }
  .funnel .fr .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--sf-navy); font-weight: 600; }
  .finding { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; margin-bottom: 8px; }
  .finding a { color: var(--b-primary); font-size: 12px; text-decoration: none; white-space: nowrap; }
  .phone { border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: #F7F8FA; display: flex; flex-direction: column; gap: 8px; }
  .bub { max-width: 82%; padding: 8px 11px; border-radius: 14px; font-size: 13px; line-height: 1.4; }
  .bub.in { background: #fff; border: 1px solid var(--line); align-self: flex-start; }
  .bub.out { background: var(--b-primary); color: #fff; align-self: flex-end; }
  .bub.t { align-self: center; background: none; font-family: var(--mono); font-size: 11px; color: #7C3AED; padding: 0; }
  .cmp2 td.good { color: var(--ok); font-weight: 600; }
  .cmp2 td.bad { color: var(--err); }
  .sig { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .sig .sso { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 9px; font-size: 13.5px; color: var(--sf-navy); font-weight: 500; background: #fff; }
  .sig .sso.spot { border-color: var(--b-primary); }
  .gatebar { display: grid; grid-template-columns: 90px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 12.8px; margin-bottom: 6px; }
  .gatebar .track { height: 12px; background: var(--sf-bg-alt); border-radius: 3px; position: relative; overflow: visible; }
  .gatebar .track i { display: block; height: 100%; border-radius: 3px; width: 0; transition: width .8s ease; background: var(--ok); }
  .gatebar .track i.bad { background: var(--err); }
  .gatebar .track b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--sf-navy); }
  @media (max-width: 720px) {
    .hb-row { grid-template-columns: 120px minmax(0, 1fr) 48px; }
    .hb-row .num.x { display: none; }
    .funnel .fr { grid-template-columns: 120px minmax(0, 1fr) 56px; }
    .form { grid-template-columns: 1fr; }
    .tr-row { grid-template-columns: minmax(0, 1fr) 70px; }
    .tr-row .bar2 { display: none; }
  }
  .gsearch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; margin: -6px 0 18px; background: var(--sf-off); font-size: 13px; color: var(--sf-mid); }
  .gsearch.on { border-color: var(--b-primary); box-shadow: 0 0 0 3px var(--b-soft); background: #fff; color: var(--sf-navy); }
  .gsearch .q { flex: 1; min-width: 0; font-family: var(--mono); }
  .gsearch kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; background: #fff; color: var(--sf-mid); }
  .drop { border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(11,22,40,.10); margin: -10px 0 16px; overflow: hidden; }
  .drop .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--sf-mid); background: var(--sf-bg-alt); padding: 6px 12px; font-weight: 600; }
  .drop .it { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; align-items: center; }
  .drop .it.on { background: var(--b-soft); box-shadow: inset 3px 0 0 var(--b-primary); }
  .drop .it b { color: var(--sf-navy); }
  .drop mark { background: #FEF08A; color: inherit; border-radius: 2px; padding: 0 1px; }
  .stack { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin: 6px 0 8px; }
  .stack i { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11.5px; font-style: normal; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .big-num { font-size: 26px; font-weight: 700; color: var(--sf-navy); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .p-nav a .lbl { flex: 1; }
  .nb { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.12); color: #C9D4E0; white-space: nowrap; }
  .nb.g { background: rgba(22,163,74,.22); color: #86EFAC; }
  .nb.a { background: rgba(245,158,11,.22); color: #FCD34D; }
  .nb.b { background: rgba(46,160,224,.25); color: #9BD7F5; }
  .nb .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ADE80; margin-right: 4px; vertical-align: 1px; }
  @media (max-width: 720px) { .nb { display: none; } }
  .cdiag { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; overflow-x: auto; }
  .cdiag svg { display: block; width: 100%; min-width: 620px; height: auto; }
</style>
</head>

    var last = "";
    beatsEl.innerHTML = (shortMode ? '<li class="sect">First meeting · 7 beats</li>' : "") + order().map(function (k, n) {
      var b = BEATS[k], h = "";
      if (!shortMode && b.sect !== last) { h += '<li class="sect">' + b.sect + "</li>"; last = b.sect; }
      return h + '<li><button data-k="' + k + '" class="' + (k === i ? "on" : "") + '"><span class="n">' + (n + 1) + "</span><span>" + b.t + "</span></button></li>";
    }).join("");
  }

  function reduced() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

  function fillBars() {
    var els = screen.querySelectorAll("[data-w]");
    setTimeout(function () { Array.prototype.forEach.call(els, function (e) { e.style.width = e.getAttribute("data-w") + "%"; }); }, reduced() ? 0 : 120);
  }

  function animateList() {
    var lis = screen.querySelectorAll("#anim .ln");
    var n = 0;
    function tick() {
      if (n >= lis.length) return;
      lis[n].classList.remove("pending");
      n++;
      subTimer = setTimeout(tick, reduced() ? 0 : 520);
    }
    tick();
  }

  function show(k) {
    i = Math.max(0, Math.min(BEATS.length - 1, k));
    var b = BEATS[i];
    clearTimeout(subTimer);
    screen.innerHTML = S[b.s]();
    if (S[b.s].post) S[b.s].post();
    urlEl.innerHTML = '<span class="lock">&#128274;</span>brightleaf.sectorflow.ai' + (URLS[b.s] || "/");
    narrEl.innerHTML = '<div class="beat-no">Beat ' + (pos() + 1) + " of " + order().length + " · " + (shortMode ? "First meeting" : b.sect) + '</div><h2 class="beat-title">' + b.t + '</h2><div class="who">' + b.who + '</div><p class="vo">' + b.vo + '</p><div class="proves"><b>Shows:</b> ' + b.p + "</div>";
    counterEl.textContent = (pos() + 1) + " / " + order().length;
    renderBeatList();
    var on = beatsEl.querySelector("button.on");
    if (on) beatsEl.scrollTop = Math.max(0, on.parentNode.offsetTop - beatsEl.offsetTop - 120);
    if (b.anim === "list") animateList();
    fillBars();
    try { history.replaceState(null, "", "#step" + (i + 1) + (shortMode ? "-first" : "")); } catch (e) {}
  }

  function setAuto(on) {
    clearInterval(autoTimer);
    autoTimer = null;
    document.getElementById("auto").setAttribute("aria-pressed", on ? "true" : "false");
    if (on) autoTimer = setInterval(function () { var o = order(); if (pos() < o.length - 1) step(1); else setAuto(false); }, 11000);
  }

  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  var pathBtn = document.getElementById("pathbtn");
  function setShort(on) { shortMode = on; pathBtn.setAttribute("aria-pressed", on ? "true" : "false"); pathBtn.textContent = on ? "Full walkthrough (" + BEATS.length + ")" : "First meeting (" + SHORT.length + ")"; if (on && SHORT.indexOf(i) < 0) show(SHORT[0]); else show(i); }
  pathBtn.addEventListener("click", function () { setShort(!shortMode); });
  document.getElementById("auto").addEventListener("click", function () { setAuto(!autoTimer); });
  beatsEl.addEventListener("click", function (e) { var btn = e.target.closest("button[data-k]"); if (btn) show(+btn.getAttribute("data-k")); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "p" || e.key === "P") setAuto(!autoTimer);
  });
  function fromHash() { var m = /#step(\d+)/.exec(location.hash); return m ? +m[1] - 1 : 0; }
  window.addEventListener("hashchange", function () { var k = fromHash(); if (k !== i) show(k); });
  if (/-first|#first/.test(location.hash)) { shortMode = true; pathBtn.setAttribute("aria-pressed", "true"); pathBtn.textContent = "Full walkthrough (" + BEATS.length + ")"; }
  var k0 = /#step\d+/.test(location.hash) ? fromHash() : (shortMode ? SHORT[0] : 0);
  show(k0);
})();
</script>

</body>
</html>
